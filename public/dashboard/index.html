<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <meta charset="UTF-8">
  <script>(function(d){d.className="js";try{if(!sessionStorage.getItem("bsu_seen"))d.className+=" first"}catch(e){}})(document.documentElement)</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dashboard · Big Sky Uber</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0c0c0e">
  <link rel="icon" href="/assets/icon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/assets/icon-180.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap">
  <link rel="stylesheet" href="/css/site.css?v=11">
  <link rel="stylesheet" href="/css/panel.css?v=11">
</head>
<body data-page="dashboard">
  <div class="ambient" aria-hidden="true"></div>
  <header class="top" id="top"></header>

  <main id="main">
    <section class="panel-head">
      <div class="grid-bg" aria-hidden="true"></div>
      <div class="wrap panel-head-row">
        <div>
          <span class="eyebrow reveal"><span class="dot white"></span>Dashboard</span>
          <h1 style="margin-top:16px" id="dash-hello" data-split>Your Big Sky.</h1>
          <p class="muted reveal" id="dash-sub">Loading your account…</p>
        </div>
        <div class="dash-actions reveal" style="--d:120ms">
          <a class="btn ghost" href="/eats">Order food</a>
          <a class="btn" href="/ride">Request a ride</a>
        </div>
      </div>
    </section>

    <div class="wrap panel-body" id="dash"></div>
  </main>

  <footer class="foot" id="foot"></footer>
  <script src="/js/map.js?v=11"></script>
  <script src="/js/core.js?v=11"></script>
  <script src="/js/dashboard.js?v=11"></script>
</body>
</html>
