<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <meta charset="UTF-8">
  <script>(function(d){d.className="js";try{if(!sessionStorage.getItem("bsu_seen"))d.className+=" first"}catch(e){}})(document.documentElement)</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Reviews · Big Sky Uber</title>
  <meta name="description" content="What riders say about Big Sky Uber. Read reviews or rate your last trip.">
  <meta name="theme-color" content="#0c0c0e">
  <link rel="icon" href="/assets/icon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/assets/icon-180.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap">
  <link rel="stylesheet" href="/css/site.css?v=7">
</head>
<body data-page="reviews">
  <div class="ambient" aria-hidden="true"></div>
  <header class="top" id="top"></header>

  <main id="main">
    <section class="page-head">
      <div class="grid-bg" aria-hidden="true"></div>
      <div class="wrap">
        <span class="eyebrow reveal">Reviews</span>
        <h1 class="h1" data-split style="margin-top:20px">Five stars, one ride at a time.</h1>
        <p class="lede reveal">Real reviews from Big Sky riders, posted with their Discord accounts.</p>
      </div>
    </section>

    <section class="wrap" style="padding-bottom:80px">
      <div class="review-layout">
        <aside class="review-side">
          <div class="card pad-lg reveal">
            <div class="score" id="score">–</div>
            <div style="margin-top:12px" id="score-stars"></div>
            <p class="muted" style="margin-top:8px;font-size:14px" id="score-count">Loading…</p>
            <div class="dist" id="dist"></div>
          </div>
          <div class="card pad-lg reveal" id="write" style="--d:80ms">
            <h2 class="h3" style="font-size:22px">Write a review</h2>
            <div id="write-body" style="margin-top:16px"><div class="spinner"></div></div>
          </div>
        </aside>
        <div>
          <div class="filters" id="filters">
            <button class="filter on" data-f="all">All</button>
            <button class="filter" data-f="5">5 ★</button>
            <button class="filter" data-f="4">4 ★</button>
            <button class="filter" data-f="low">3 ★ &amp; under</button>
            <button class="filter" data-f="uber">Uber</button>
            <button class="filter" data-f="premium">Premium</button>
            <button class="filter" data-f="black">Black</button>
          </div>
          <div class="review-grid" id="review-grid"></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="foot" id="foot"></footer>
  <script src="/js/map.js?v=7"></script>
  <script src="/js/core.js?v=7"></script>
  <script src="/js/reviews.js?v=7"></script>
</body>
</html>
