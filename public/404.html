<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Wrong turn · Big Sky Uber</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0c0c0e">
  <link rel="icon" href="/assets/icon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/assets/icon-180.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap">
  <link rel="stylesheet" href="/css/site.css?v=2">
</head>
<body data-page="404" class="has-hero">
  <div class="ambient" aria-hidden="true"></div>
  <header class="top" id="top"></header>
  <main id="main" class="lost">
    <div class="lost-map" id="lost-map" aria-hidden="true"></div>
    <div>
      <div class="lost-code chrome reveal">404</div>
      <h1 class="reveal" style="--d:100ms">Looks like we took a wrong turn.</h1>
      <p class="reveal" style="--d:180ms">This address isn’t on our map. Your driver is rerouting, but you might want to head back.</p>
      <div class="row reveal" style="--d:260ms">
        <a class="btn" href="/">Take me home</a>
        <a class="btn ghost" href="/ride">Request a ride</a>
      </div>
    </div>
  </main>
  <footer class="foot" id="foot"></footer>
  <script src="/js/map.js?v=2"></script>
  <script src="/js/core.js?v=2"></script>
  <script>BSUMap.mount(document.getElementById('lost-map'), { width: 1400, height: 900, loop: true, duration: 6000, safeTop: 80, safeBottom: 80 });</script>
</body>
</html>
