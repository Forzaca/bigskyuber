<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <meta charset="UTF-8">
  <script>(function(d){d.className="js";try{if(!sessionStorage.getItem("bsu_seen"))d.className+=" first"}catch(e){}})(document.documentElement)</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Driver panel · Big Sky Uber</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0c0c0e">
  <link rel="icon" href="/assets/icon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/assets/icon-180.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap">
  <link rel="stylesheet" href="/css/site.css?v=3">
  <link rel="stylesheet" href="/css/panel.css?v=3">
</head>
<body data-page="workers">
  <div class="ambient" aria-hidden="true"></div>
  <header class="top" id="top"></header>

  <main id="main">
    <section class="panel-head">
      <div class="grid-bg" aria-hidden="true"></div>
      <div class="wrap panel-head-row">
        <div>
          <span class="eyebrow"><span class="dot white"></span>Driver panel</span>
          <h1 style="margin-top:16px" id="hello">Hey, driver.</h1>
          <p class="muted" id="hello-sub">Loading your shift…</p>
        </div>
        <div class="duty glass" id="duty">
          <span class="dot" id="duty-dot"></span>
          <div><b id="duty-title">Offline</b><span id="duty-sub">Go online to see new requests</span></div>
          <label class="switch" aria-label="Online"><input type="checkbox" id="duty-toggle" disabled><span></span></label>
        </div>
      </div>
    </section>

    <div class="wrap panel-body">
      <div class="tiles" id="tiles">
        <div class="tile"><small>Today</small><b data-t="today">–</b><div class="sub">completed trips</div></div>
        <div class="tile"><small>All time</small><b data-t="total">–</b><div class="sub">completed trips</div></div>
        <div class="tile"><small>This week</small><b data-t="week">–</b><div class="sub" data-t="shift">on shift</div></div>
        <div class="tile"><small>Earned</small><b data-t="earned">–</b><div class="sub">in-game cash</div></div>
        <div class="tile"><small>Rating</small><b data-t="rating">–</b><div class="sub" data-t="ratings">no ratings yet</div></div>
        <div class="tile white"><small>Waiting</small><b data-t="queue">–</b><div class="sub" data-t="online">drivers online</div></div>
      </div>

      <nav class="tabs" id="tabs" role="tablist">
        <button class="tab on" data-tab="queue" role="tab">Queue <span class="count" data-c="queue">0</span></button>
        <button class="tab" data-tab="current" role="tab">Current ride <span class="count" data-c="current">0</span></button>
        <button class="tab" data-tab="log" role="tab">Ride log</button>
        <button class="tab" data-tab="reviews" role="tab">My reviews</button>
        <button class="tab" data-tab="profile" role="tab">Profile</button>
      </nav>

      <section class="pane" data-pane="queue"></section>
      <section class="pane" data-pane="current" hidden></section>
      <section class="pane" data-pane="log" hidden></section>
      <section class="pane" data-pane="reviews" hidden></section>
      <section class="pane" data-pane="profile" hidden></section>
    </div>
  </main>

  <footer class="foot" id="foot"></footer>
  <script src="/js/map.js?v=3"></script>
  <script src="/js/core.js?v=3"></script>
  <script src="/js/panel.js?v=3"></script>
  <script src="/js/workers.js?v=3"></script>
</body>
</html>
