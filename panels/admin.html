<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <meta charset="UTF-8">
  <script>(function(d){d.className="js";try{if(!sessionStorage.getItem("bsu_seen"))d.className+=" first"}catch(e){}})(document.documentElement)</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Admin · Big Sky Uber</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0c0c0e">
  <link rel="icon" href="/assets/icon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/assets/icon-180.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap">
  <link rel="stylesheet" href="/css/site.css?v=10">
  <link rel="stylesheet" href="/css/panel.css?v=10">
</head>
<body data-page="admin">
  <div class="ambient" aria-hidden="true"></div>
  <header class="top" id="top"></header>

  <main id="main">
    <section class="panel-head">
      <div class="grid-bg" aria-hidden="true"></div>
      <div class="wrap panel-head-row">
        <div>
          <span class="eyebrow"><span class="dot white"></span>Admin</span>
          <h1 style="margin-top:16px">Control room.</h1>
          <p class="muted" id="admin-sub">Loading…</p>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn sm ghost" id="refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.7-4.3L4 8M4 4v4h4M4 13a8 8 0 0 0 14.7 4.3L20 16M20 20v-4h-4"/></svg>Refresh</button>
          <a class="btn sm" href="/workers">Driver panel</a>
        </div>
      </div>
    </section>

    <div class="wrap panel-body">
      <nav class="tabs" id="tabs" role="tablist">
        <button class="tab on" data-tab="overview" role="tab">Overview</button>
        <button class="tab" data-tab="analytics" role="tab">Analytics</button>
        <button class="tab" data-tab="money" role="tab">Money</button>
        <button class="tab" data-tab="shifts" role="tab">Shifts <span class="count" data-c="shifts">0</span></button>
        <button class="tab" data-tab="payroll" role="tab">Payroll <span class="count" data-c="payroll">0</span></button>
        <button class="tab" data-tab="rides" role="tab">Ride logs <span class="count" data-c="rides">0</span></button>
        <button class="tab" data-tab="drivers" role="tab">Drivers <span class="count" data-c="drivers">0</span></button>
        <button class="tab" data-tab="reviews" role="tab">Reviews <span class="count" data-c="reviews">0</span></button>
        <button class="tab" data-tab="users" role="tab">Users &amp; bans</button>
        <button class="tab" data-tab="notify" role="tab">Notify</button>
        <button class="tab" data-tab="settings" role="tab">Settings</button>
        <button class="tab" data-tab="api" role="tab">API &amp; system</button>
      </nav>

      <section class="pane" data-pane="overview"></section>
      <section class="pane" data-pane="analytics" hidden></section>
      <section class="pane" data-pane="money" hidden></section>
      <section class="pane" data-pane="shifts" hidden></section>
      <section class="pane" data-pane="payroll" hidden></section>
      <section class="pane" data-pane="rides" hidden></section>
      <section class="pane" data-pane="drivers" hidden></section>
      <section class="pane" data-pane="reviews" hidden></section>
      <section class="pane" data-pane="users" hidden></section>
      <section class="pane" data-pane="notify" hidden></section>
      <section class="pane" data-pane="settings" hidden></section>
      <section class="pane" data-pane="api" hidden></section>
    </div>
  </main>

  <footer class="foot" id="foot"></footer>
  <script src="/js/map.js?v=10"></script>
  <script src="/js/core.js?v=10"></script>
  <script src="/js/panel.js?v=10"></script>
  <script src="/js/admin.js?v=10"></script>
</body>
</html>
